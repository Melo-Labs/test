name: Mac-App bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["recipes.json", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: App bauen
        run: ./macos/build.sh

      - name: Zip erstellen
        run: ditto -c -k --keepParent "build/Kilo für Kilo.app" build/Kilo-fuer-Kilo-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kilo-fuer-Kilo-mac
          path: build/Kilo-fuer-Kilo-mac.zip

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Kilo-fuer-Kilo-mac.zip --title "Kilo für Kilo $GITHUB_REF_NAME" --generate-notes
